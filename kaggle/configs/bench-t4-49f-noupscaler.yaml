# ReelForge T4 benchmark config — 49 frames, 480x832, no upscaler.
# Purpose: minimal first-pass timing measurement only.
# DO NOT use for production generation.
#
# Differences from reelforge-t4-distilled.yaml:
#   - pipeline_type omitted → single-pass LTXVideoPipeline (no spatial upscaler)
#   - spatial_upscaler_model_path omitted → no upscaler download/load

checkpoint_path: "/root/.cache/reelforge-ltx/ltxv-2b-0.9.8-distilled.safetensors"
text_encoder_model_name_or_path: "/root/.cache/reelforge-ltx/text_encoder"
precision: "bfloat16"
sampler: "from_checkpoint"
stg_mode: "attention_values"
decode_timestep: 0.05
decode_noise_scale: 0.025
prompt_enhancement_words_threshold: 0
prompt_enhancer_image_caption_model_name_or_path: "MiaoshouAI/Florence-2-large-PromptGen-v2.0"
prompt_enhancer_llm_model_name_or_path: "unsloth/Llama-3.2-3B-Instruct"
stochastic_sampling: false

timesteps: [1.0000, 0.9937, 0.9875, 0.9812, 0.9750, 0.9094, 0.7250, 0.4219]
guidance_scale: 1
stg_scale: 0
rescaling_scale: 1
skip_block_list: [42]
