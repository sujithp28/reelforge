name: CI

on:
  push:
    branches: [Dev, main]
  pull_request:
    branches: [Dev, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      # The caption tests need a real TTF, and the render pipeline shells out
      # to ffmpeg, so install both rather than skipping those checks.
      - name: Install ffmpeg and a font
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg fonts-dejavu-core

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Unit tests (planner and ffmpeg commands)
        run: python test_reelforge.py

      - name: API tests (routes, validation, abstractions)
        run: python test_api.py

      # Provider selection, chunking, aspect-ratio normalisation, failure
      # handling, retry and scene isolation. Uses a fake HTTP transport for
      # LTX: no credentials, no GPU, no billable calls.
      - name: Generation provider tests
        run: python test_generation.py

      # Must skip cleanly rather than fail when no credentials are present.
      - name: Real LTX tests skip without credentials
        run: python test_ltx_integration.py

      - name: Import the app
        run: python -c "from app.main import app; print(app.title, app.version)"

      # Catches a schema that only works because SQLite skips foreign-key
      # validation, which is what hid the assets/scenes ordering bug.
      - name: Schema is ordered for a strict database
        run: python check_schema_order.py

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build
        run: npm run build
